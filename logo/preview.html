<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Знак Садохода</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f5f1ea; font: 600 15px Manrope, sans-serif; color: #151010; padding: 32px; }
  h1 { font: 800 28px Unbounded; text-transform: uppercase; letter-spacing: -.03em; margin: 0 0 24px; }
  .row { display: grid; grid-template-columns: 220px repeat(5, auto); gap: 22px; align-items: center; background: #fff; border-radius: 28px; padding: 22px 26px; margin-bottom: 16px; }
  .row h2 { font: 800 22px Unbounded; margin: 0 0 6px; text-transform: uppercase; }
  .row p { margin: 0; color: #776c66; font-size: 13px; line-height: 1.4; }
  .ic { width: 120px; height: 120px; border-radius: 28px; display: block; box-shadow: 0 14px 30px -14px rgba(0,0,0,.35); }
  .av { width: 96px; height: 96px; border-radius: 50%; display: block; }
  .lock { display: flex; align-items: center; gap: 10px; font: 800 26px Unbounded; letter-spacing: -.03em; }
  .lock img { width: 44px; }
  .dark { background: #141010; color: #fff; padding: 14px 18px; border-radius: 18px; }
  .tiny { display: flex; gap: 10px; align-items: center; }
  .tiny img { width: 20px; } .tiny img + img { width: 32px; }
  small { display: block; text-align: center; color: #999; font-size: 11px; margin-top: 6px; }
</style></head><body>
<h1>Знак Садохода — 4 точки</h1>
<div id="rows"></div>
<script>
const V = [
  ['a', 'Клей', 'Три глянцевые плитки и светлый круг. Самый близкий к нынешнему знаку, только объёмный.'],
  ['b', 'Маршрут', 'Плитки — корпуса рынка, по проходам между ними пунктир ведёт к метке. Сразу читается «навигация».'],
  ['c', 'Шаг', 'Последняя плитка «шагнула» в сторону, за ней следы движения. Знак сам про «ход».'],
];
document.getElementById('rows').innerHTML = V.map(([k, n, d]) => `
  <div class="row">
    <div><h2>${String.fromCharCode(1040 + 'abc'.indexOf(k))} · ${n}</h2><p>${d}</p></div>
    <div><img class="ic" src="icon-${k}-orange.svg"><small>иконка</small></div>
    <div><img class="av" src="icon-${k}-dark.svg"><small>аватар бота</small></div>
    <div><img class="av" src="icon-${k}-cream.svg"><small>светлый</small></div>
    <div class="lock"><img src="mark-${k}.svg">Садоход</div>
    <div><div class="lock dark"><img src="mark-${k}.svg">Садоход</div><div class="tiny" style="margin-top:10px"><img src="mark-${k}.svg"><img src="mark-${k}.svg"><small style="margin:0">мелко</small></div></div>
  </div>`).join('');
</script>
</body></html>
